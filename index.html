<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kanban</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f11;--surface:#18181c;--surface2:#222228;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--text:#e8e6e0;--muted:#7a7875;--accent:#c9a96e;--accent2:#8b6fae;--radius:12px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;}
#topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;}
#app-title{font-size:16px;font-weight:500;color:var(--accent);flex:1;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#97C459;flex-shrink:0;transition:background 0.3s;}
.sync-dot.syncing{background:var(--accent);animation:pulse 1s infinite;}
.sync-dot.error{background:#f08080;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
#board-tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none;}
#board-tabs::-webkit-scrollbar{display:none;}
.tab{font-size:12px;padding:6px 14px;border-radius:99px;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--muted);white-space:nowrap;font-family:'Manrope',sans-serif;}
.tab.active{background:var(--accent);color:#1a1208;border-color:var(--accent);font-weight:600;}
#view-toggle{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center;}
.view-btn{font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--muted);font-family:'Manrope',sans-serif;}
.view-btn.active{background:var(--surface2);color:var(--text);border-color:rgba(255,255,255,0.25);}
#add-board-btn{margin-left:auto;font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--muted);font-family:'Manrope',sans-serif;}
#board-view{padding:14px 16px;display:flex;flex-direction:column;gap:14px;}
.column{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.col-head{padding:11px 13px 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.col-title-text{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);outline:none;min-width:80px;}
.col-count{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:1px 8px;color:var(--muted);}
.col-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0 3px;line-height:1;}
.cards-list{padding:8px;display:flex;flex-direction:column;gap:6px;}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;position:relative;}
.card-title{font-size:13px;color:var(--text);line-height:1.5;padding-right:24px;}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap;}
.card-tag{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;}
.card-priority{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid;}
.p-high{color:#f08080;border-color:rgba(240,128,128,0.3);}
.p-med{color:#d4a855;border-color:rgba(212,168,85,0.3);}
.p-low{color:#7a7875;border-color:rgba(122,120,117,0.3);}
.t-dev{background:rgba(55,138,221,0.15);color:#7bb8f0;}
.t-design{background:rgba(139,111,174,0.15);color:#b89fd4;}
.t-urgent{background:rgba(216,90,48,0.15);color:#f0956a;}
.t-review{background:rgba(186,117,23,0.15);color:#d4a855;}
.t-done{background:rgba(99,153,34,0.15);color:#99cc55;}
.t-idea{background:rgba(212,83,126,0.15);color:#e890b0;}
.card-del{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px;}
.card-move-btns{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;}
.move-btn{font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:'Manrope',sans-serif;}
.add-card-btn{width:100%;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;padding:8px 13px 10px;text-align:left;font-family:'Manrope',sans-serif;}
.add-card-form{display:none;flex-direction:column;gap:6px;padding:0 8px 10px;}
.add-card-form textarea{font-size:13px;font-family:'Manrope',sans-serif;padding:8px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);color:var(--text);resize:none;height:72px;width:100%;}
.add-card-form select{font-size:12px;font-family:'Manrope',sans-serif;padding:6px 9px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);color:var(--muted);width:100%;}
.form-row{display:flex;gap:6px;}
.btn-ok{font-size:12px;font-family:'Manrope',sans-serif;padding:8px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#1a1208;cursor:pointer;font-weight:600;}
.btn-cancel{font-size:12px;font-family:'Manrope',sans-serif;padding:8px 12px;border-radius:8px;border:none;background:none;color:var(--muted);cursor:pointer;}

/* GANTT MOBILE */
#timeline-view{padding:14px 16px;display:none;}
.gantt-ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.gantt-ctrl-label{font-size:12px;color:var(--muted);}
.gantt-ctrl-input{font-size:13px;font-family:'Manrope',sans-serif;padding:6px 9px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);color:var(--text);width:72px;}
.gantt-scroll{overflow-x:auto;padding-bottom:6px;}
.gantt-scroll::-webkit-scrollbar{height:4px;}
.gantt-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.gantt-inner{min-width:500px;}
.g-header{display:flex;margin-left:110px;margin-bottom:3px;}
.g-day{flex:1;font-size:9px;color:var(--muted);text-align:center;border-left:1px solid rgba(255,255,255,0.04);padding:2px 0;}
.g-day.today{color:#e24b4a;font-weight:600;}
.g-row{display:flex;align-items:center;height:48px;margin-bottom:3px;}
.g-label{width:110px;min-width:110px;font-size:11px;color:var(--muted);text-align:right;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-track{flex:1;position:relative;height:48px;}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.04);pointer-events:none;}
.g-today{position:absolute;top:-14px;bottom:0;width:1.5px;background:#e24b4a;z-index:5;pointer-events:none;}
.g-today-lbl{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:8px;color:#e24b4a;white-space:nowrap;}
.g-bar{position:absolute;top:50%;transform:translateY(-50%);height:28px;border-radius:6px;display:flex;align-items:center;touch-action:none;}
.g-bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;pointer-events:none;}
.g-bar-lbl{font-size:10px;font-weight:500;white-space:nowrap;padding:0 8px;position:relative;z-index:1;pointer-events:none;overflow:hidden;}
.g-handle{position:absolute;top:0;bottom:0;width:12px;z-index:3;display:flex;align-items:center;justify-content:center;touch-action:none;}
.g-handle-l{left:-1px;border-radius:6px 0 0 6px;cursor:ew-resize;}
.g-handle-r{right:-1px;border-radius:0 6px 6px 0;cursor:ew-resize;}
.g-grip{width:2px;height:14px;border-radius:1px;background:rgba(255,255,255,0.4);}
.g-ms{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2px solid;z-index:4;touch-action:none;}
.g-ms-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:4px 8px;font-size:10px;color:var(--text);white-space:nowrap;z-index:10;pointer-events:none;opacity:0;}
.g-ms:hover .g-ms-tip{opacity:1;}
.g-del{position:absolute;right:-16px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0;}
.gantt-hint{font-size:11px;color:var(--muted);margin-top:10px;text-align:center;}
.drag-tip{position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:4px 9px;font-size:11px;color:var(--text);pointer-events:none;z-index:999;display:none;}

#action-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;}
.action-btn{font-size:12px;font-family:'Manrope',sans-serif;padding:9px 14px;border-radius:9px;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--muted);flex:1;min-width:70px;text-align:center;}
.action-btn:active{background:var(--surface2);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:18px 18px 0 0;padding:20px 18px 32px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
.modal-drag{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.modal h3{font-size:17px;font-weight:500;color:var(--accent);margin-bottom:14px;}
.modal label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;margin-top:12px;}
.modal input,.modal select,.modal textarea{width:100%;font-size:14px;font-family:'Manrope',sans-serif;padding:10px 12px;border-radius:9px;border:1px solid var(--border2);background:var(--bg);color:var(--text);}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
</style>
</head>
<body>

<div id="topbar"><span id="app-title">Kanban</span><span class="sync-dot syncing" id="syncDot"></span></div>
<div id="board-tabs"></div>
<div id="view-toggle">
  <button class="view-btn active" id="vBoard">Board</button>
  <button class="view-btn" id="vTimeline">Timeline</button>
  <button id="add-board-btn">+ Board</button>
</div>
<div id="board-view"></div>
<div id="timeline-view"></div>
<div id="action-bar"></div>
<div class="drag-tip" id="dragTip"></div>

<div class="modal-overlay" id="boardModal">
  <div class="modal"><div class="modal-drag"></div>
    <h3>New board</h3><input id="boardNameInput" placeholder="Board name...">
    <div class="modal-actions"><button class="btn-cancel" id="boardModalCancel">Cancel</button><button class="btn-ok" id="boardModalOk">Create</button></div>
  </div>
</div>
<div class="modal-overlay" id="phaseModal">
  <div class="modal"><div class="modal-drag"></div>
    <h3>Add phase</h3>
    <label>Name</label><input id="pmName" placeholder="e.g. Design">
    <label>Start day</label><input id="pmStart" type="number" min="1" placeholder="1">
    <label>End day</label><input id="pmEnd" type="number" min="1" placeholder="10">
    <label>Color</label>
    <select id="pmColor"><option value="purple">Purple</option><option value="teal">Teal</option><option value="amber">Amber</option><option value="coral">Coral</option><option value="pink">Pink</option><option value="green">Green</option></select>
    <label>Milestone 1 (name, day)</label><input id="pmMs1" placeholder="Kickoff, 3">
    <label>Milestone 2</label><input id="pmMs2" placeholder="Review, 8">
    <div class="modal-actions"><button class="btn-cancel" id="pmCancel">Cancel</button><button class="btn-ok" id="pmOk">Add</button></div>
  </div>
</div>
<div class="modal-overlay" id="aiModal">
  <div class="modal"><div class="modal-drag"></div>
    <h3 id="aiModalTitle">Result</h3><div id="aiModalContent"></div>
    <div class="modal-actions" style="margin-top:12px;"><button class="btn-cancel" id="aiModalClose">Close</button></div>
  </div>
</div>

<script>
const SB_URL='https://nxnvgbuyxbfyhnxuazzv.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54bnZnYnV5eGJmeWhueHVhenp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNTk3MDgsImV4cCI6MjA4OTYzNTcwOH0.HGnQtk6uYziQlXhvTEJg3SPBzqzWaD4nHa3YGo3rOs0';
const TAGS=[{l:'dev',c:'t-dev'},{l:'design',c:'t-design'},{l:'urgent',c:'t-urgent'},{l:'review',c:'t-review'},{l:'done',c:'t-done'},{l:'idea',c:'t-idea'}];
const COLOR_MAP={
  purple:{bg:'#EEEDFE',text:'#3C3489',bar:'#AFA9EC'},teal:{bg:'#E1F5EE',text:'#085041',bar:'#5DCAA5'},
  amber:{bg:'#FAEEDA',text:'#633806',bar:'#EF9F27'},coral:{bg:'#FAECE7',text:'#712B13',bar:'#F0997B'},
  pink:{bg:'#FBEAF0',text:'#72243E',bar:'#ED93B1'},green:{bg:'#EAF3DE',text:'#27500A',bar:'#97C459'},
};
const COLORS=Object.keys(COLOR_MAP);
const DEFAULTS={'Group tasks':{cols:[{id:'c1',title:'Backlog',cards:[{id:'k1',title:'Plan next event',tag:5,priority:'med'}]},{id:'c2',title:'In progress',cards:[{id:'k2',title:'Design banner',tag:1,priority:'high'}]},{id:'c3',title:'Done',cards:[{id:'k3',title:'Welcome post',tag:4,priority:'low'}]}],phases:[{id:'p1',name:'Discovery',start:1,end:5,color:'purple',milestones:[{id:'m1',label:'Brief',day:3,done:true}]},{id:'p2',name:'Design',start:5,end:14,color:'amber',milestones:[{id:'m2',label:'Wireframes',day:8,done:false},{id:'m3',label:'Hi-fi',day:13,done:false}]},{id:'p3',name:'Launch',start:14,end:20,color:'green',milestones:[{id:'m4',label:'Launch',day:19,done:false}]}],totalDays:20,todayDay:6}};

let state={boards:null,active:null};
let uid=Date.now(),saveTimer=null,currentView='board';
let ganttDrag=null;
const dragTip=document.getElementById('dragTip');

function setSyncStatus(s){const d=document.getElementById('syncDot');d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');}
async function sbLoad(){const r=await fetch(SB_URL+'/rest/v1/kanban_data?id=eq.main&select=data',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});if(!r.ok)throw new Error('load failed');const rows=await r.json();if(Array.isArray(rows)&&rows.length>0&&rows[0].data&&Object.keys(rows[0].data).length>0)return rows[0].data;return null;}
async function sbSave(data){await fetch(SB_URL+'/rest/v1/kanban_data',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:'main',data,updated_at:new Date().toISOString()})});}
async function load(){setSyncStatus('syncing');try{const d=await sbLoad();if(d)state=d;else state={boards:DEFAULTS,active:'Group tasks'};setSyncStatus('ok');}catch(e){state={boards:DEFAULTS,active:'Group tasks'};setSyncStatus('error');}render();}
async function save(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{setSyncStatus('syncing');try{await sbSave(state);setSyncStatus('ok');}catch(e){setSyncStatus('error');}},500);}
function board(){return state.boards[state.active];}
function render(){renderTabs();renderActionBar();if(currentView==='board')renderBoard();else renderGantt();}

function renderTabs(){const el=document.getElementById('board-tabs');el.innerHTML='';Object.keys(state.boards).forEach(name=>{const b=document.createElement('button');b.className='tab'+(state.active===name?' active':'');b.textContent=name;b.onclick=()=>{state.active=name;render();};el.appendChild(b);});}

function setView(v){currentView=v;document.getElementById('vBoard').classList.toggle('active',v==='board');document.getElementById('vTimeline').classList.toggle('active',v==='timeline');document.getElementById('board-view').style.display=v==='board'?'flex':'none';document.getElementById('timeline-view').style.display=v==='timeline'?'block':'none';renderActionBar();render();}
document.getElementById('vBoard').onclick=()=>setView('board');
document.getElementById('vTimeline').onclick=()=>setView('timeline');

function renderActionBar(){
  const bar=document.getElementById('action-bar');bar.innerHTML='';
  if(currentView==='board'){
    const b=document.createElement('button');b.className='action-btn';b.textContent='+ Column';b.onclick=()=>{board().cols.push({id:'col'+(uid++),title:'New',cards:[]});save();render();};bar.appendChild(b);
  } else {
    [{l:'+ Phase',f:()=>document.getElementById('phaseModal').classList.add('open')},{l:'+ Milestone',f:addMilestonePrompt}]
    .forEach(({l,f})=>{const b=document.createElement('button');b.className='action-btn';b.textContent=l;b.onclick=f;bar.appendChild(b);});
  }
}

function addMilestonePrompt(){
  const phases=board().phases||[];if(!phases.length){alert('Add a phase first.');return;}
  const names=phases.map((p,i)=>i+': '+p.name).join('\n');
  const idx=prompt('Which phase? (enter number)\n'+names);if(idx===null)return;
  const phase=phases[parseInt(idx)];if(!phase)return;
  const lbl=prompt('Milestone name:');if(!lbl)return;
  const day=parseInt(prompt('Day:',Math.round((phase.start+phase.end)/2)));if(!day)return;
  if(!phase.milestones)phase.milestones=[];
  phase.milestones.push({id:'m'+(uid++),label:lbl,day,done:false});
  save();renderGantt();
}

function renderBoard(){
  const wrap=document.getElementById('board-view');wrap.innerHTML='';wrap.style.cssText='padding:14px 16px;display:flex;flex-direction:column;gap:14px;';
  board().cols.forEach(col=>{
    const colEl=document.createElement('div');colEl.className='column';
    const head=document.createElement('div');head.className='col-head';
    const titleEl=document.createElement('span');titleEl.className='col-title-text';titleEl.textContent=col.title;titleEl.contentEditable=true;titleEl.spellcheck=false;
    titleEl.onblur=()=>{const v=titleEl.textContent.trim();if(v){col.title=v;save();}};
    const right=document.createElement('div');right.style.cssText='display:flex;align-items:center;gap:6px;';
    const cnt=document.createElement('span');cnt.className='col-count';cnt.textContent=col.cards.length;
    const del=document.createElement('button');del.className='col-del';del.innerHTML='&times;';
    del.onclick=()=>{if(col.cards.length>0&&!confirm('Delete column?'))return;board().cols=board().cols.filter(c=>c.id!==col.id);save();render();};
    right.appendChild(cnt);right.appendChild(del);head.appendChild(titleEl);head.appendChild(right);colEl.appendChild(head);
    const cardsList=document.createElement('div');cardsList.className='cards-list';
    col.cards.forEach(card=>{
      const tag=TAGS[card.tag]||TAGS[0];const pClass=card.priority==='high'?'p-high':card.priority==='low'?'p-low':'p-med';
      const cd=document.createElement('div');cd.className='card';
      cd.innerHTML=`<button class="card-del">&times;</button><div class="card-title">${card.title}</div><div class="card-meta"><span class="card-tag ${tag.c}">${tag.l}</span><span class="card-priority ${pClass}">${card.priority||'med'}</span></div>`;
      const moveBtns=document.createElement('div');moveBtns.className='card-move-btns';
      board().cols.forEach(tc=>{if(tc.id===col.id)return;const mb=document.createElement('button');mb.className='move-btn';mb.textContent='→ '+tc.title;mb.onclick=()=>{col.cards=col.cards.filter(c=>c.id!==card.id);tc.cards.push(card);save();render();};moveBtns.appendChild(mb);});
      cd.appendChild(moveBtns);cd.querySelector('.card-del').onclick=()=>{col.cards=col.cards.filter(c=>c.id!==card.id);save();render();};cardsList.appendChild(cd);
    });
    colEl.appendChild(cardsList);
    const addBtn=document.createElement('button');addBtn.className='add-card-btn';addBtn.textContent='+ Add card';
    const form=document.createElement('div');form.className='add-card-form';
    form.innerHTML=`<textarea placeholder="Card text..."></textarea><select>${TAGS.map((t,i)=>`<option value="${i}">${t.l}</option>`).join('')}</select><div class="form-row"><button class="btn-ok" data-ok>Add</button><button class="btn-cancel" data-cancel>Cancel</button></div>`;
    addBtn.onclick=()=>{form.style.display='flex';addBtn.style.display='none';form.querySelector('textarea').focus();};
    form.querySelector('[data-cancel]').onclick=()=>{form.style.display='none';addBtn.style.display='';form.querySelector('textarea').value='';};
    form.querySelector('[data-ok]').onclick=()=>{const v=form.querySelector('textarea').value.trim();if(!v)return;col.cards.push({id:'k'+(uid++),title:v,tag:parseInt(form.querySelector('select').value),priority:'med'});save();render();};
    colEl.appendChild(addBtn);colEl.appendChild(form);wrap.appendChild(colEl);
  });
}

function renderGantt(){
  const b=board();const phases=b.phases||[];const totalDays=b.totalDays||20;const todayDay=b.todayDay||1;
  const wrap=document.getElementById('timeline-view');wrap.innerHTML='';

  const ctrl=document.createElement('div');ctrl.className='gantt-ctrl-row';
  ctrl.innerHTML=`<span class="gantt-ctrl-label">Total days:</span><input class="gantt-ctrl-input" type="number" id="gTotalDays" min="7" max="365" value="${totalDays}"><span class="gantt-ctrl-label" style="margin-left:8px;">Today:</span><input class="gantt-ctrl-input" type="number" id="gToday" min="1" max="${totalDays}" value="${todayDay}">`;
  wrap.appendChild(ctrl);
  document.getElementById('gTotalDays').onchange=e=>{b.totalDays=Math.max(7,parseInt(e.target.value)||20);save();renderGantt();};
  document.getElementById('gToday').onchange=e=>{b.todayDay=Math.max(1,parseInt(e.target.value)||1);save();renderGantt();};

  const scroll=document.createElement('div');scroll.className='gantt-scroll';
  const inner=document.createElement('div');inner.className='gantt-inner';

  function pct(d){return Math.max(0,((d-1)/totalDays*100)).toFixed(4)+'%';}

  const hdr=document.createElement('div');hdr.className='g-header';
  for(let d=1;d<=totalDays;d++){const c=document.createElement('div');c.className='g-day'+(d===todayDay?' today':'');c.textContent=(d===1||d===totalDays||d%5===0)?d:'';hdr.appendChild(c);}
  inner.appendChild(hdr);

  if(!phases.length){const empty=document.createElement('div');empty.style.cssText='text-align:center;padding:30px 0;color:var(--muted);font-size:13px;';empty.textContent='No phases yet. Tap "+ Phase" below.';inner.appendChild(empty);}

  phases.forEach(phase=>{
    const c=COLOR_MAP[phase.color]||COLOR_MAP.purple;
    const row=document.createElement('div');row.className='g-row';
    const lbl=document.createElement('div');lbl.className='g-label';lbl.textContent=phase.name;row.appendChild(lbl);
    const track=document.createElement('div');track.className='g-track';

    for(let d=1;d<=totalDays+1;d++){const gl=document.createElement('div');gl.className='g-grid';gl.style.left=pct(d);gl.style.top='0';gl.style.bottom='0';gl.style.position='absolute';track.appendChild(gl);}
    if(todayDay>=1&&todayDay<=totalDays){const tl=document.createElement('div');tl.className='g-today';tl.style.left=pct(todayDay);const tlbl=document.createElement('div');tlbl.className='g-today-lbl';tlbl.textContent='d'+todayDay;tl.appendChild(tlbl);track.appendChild(tl);}

    const barLeft=((phase.start-1)/totalDays*100).toFixed(4)+'%';
    const barW=Math.max(1,(phase.end-phase.start)/totalDays*100).toFixed(4)+'%';
    const progress=phase.end>phase.start?Math.min(1,Math.max(0,(todayDay-phase.start)/(phase.end-phase.start))):0;

    const bar=document.createElement('div');bar.className='g-bar';bar.style.cssText=`left:${barLeft};width:${barW};background:${c.bg};`;
    const fill=document.createElement('div');fill.className='g-bar-fill';fill.style.cssText=`width:${(progress*100).toFixed(1)}%;background:${c.bar};opacity:0.45;`;
    bar.appendChild(fill);
    const barLbl=document.createElement('span');barLbl.className='g-bar-lbl';barLbl.style.color=c.text;barLbl.textContent=phase.name+' ('+phase.start+'–'+phase.end+')';bar.appendChild(barLbl);

    const hL=document.createElement('div');hL.className='g-handle g-handle-l';hL.style.background=c.bar;hL.appendChild(Object.assign(document.createElement('div'),{className:'g-grip'}));
    const hR=document.createElement('div');hR.className='g-handle g-handle-r';hR.style.background=c.bar;hR.appendChild(Object.assign(document.createElement('div'),{className:'g-grip'}));
    bar.appendChild(hL);bar.appendChild(hR);

    function startDrag(type,clientX){ganttDrag={type,phase,startX:clientX,origStart:phase.start,origEnd:phase.end,trackEl:track};}
    function startMsDrag(m,clientX){ganttDrag={type:'milestone',ms:m,startX:clientX,origDay:m.day,trackEl:track};}

    bar.addEventListener('mousedown',e=>{if(e.target.closest('.g-handle'))return;e.preventDefault();startDrag('move',e.clientX);});
    hL.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();startDrag('resize-left',e.clientX);});
    hR.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();startDrag('resize-right',e.clientX);});
    bar.addEventListener('touchstart',e=>{if(e.target.closest('.g-handle'))return;e.preventDefault();startDrag('move',e.touches[0].clientX);},{passive:false});
    hL.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();startDrag('resize-left',e.touches[0].clientX);},{passive:false});
    hR.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();startDrag('resize-right',e.touches[0].clientX);},{passive:false});

    track.appendChild(bar);

    (phase.milestones||[]).forEach(m=>{
      const dot=document.createElement('div');dot.className='g-ms';dot.style.cssText=`left:${pct(m.day)};background:${m.done?c.bar:'var(--surface2)'};border-color:${c.bar};`;
      const tip=document.createElement('div');tip.className='g-ms-tip';tip.textContent=(m.done?'✓ ':'')+m.label+' d'+m.day;dot.appendChild(tip);
      dot.addEventListener('click',e=>{e.stopPropagation();m.done=!m.done;save();renderGantt();});
      dot.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();startMsDrag(m,e.clientX);});
      dot.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();startMsDrag(m,e.touches[0].clientX);},{passive:false});
      track.appendChild(dot);
    });

    const delBtn=document.createElement('button');delBtn.className='g-del';delBtn.innerHTML='&times;';
    delBtn.onclick=()=>{if(confirm('Delete "'+phase.name+'"?')){b.phases=b.phases.filter(p=>p.id!==phase.id);save();renderGantt();}};
    track.appendChild(delBtn);
    row.appendChild(track);inner.appendChild(row);
  });

  scroll.appendChild(inner);wrap.appendChild(scroll);
  const hint=document.createElement('div');hint.className='gantt-hint';hint.textContent='Drag bar = move · drag edges = resize · tap milestone = toggle done';
  wrap.appendChild(hint);
}

function handleDragMove(clientX,clientY){
  if(!ganttDrag)return;
  const rect=ganttDrag.trackEl.getBoundingClientRect();
  const dx=clientX-ganttDrag.startX;
  const totalDays=board().totalDays||20;
  const ddays=Math.round(dx/rect.width*totalDays);
  const {type,phase}=ganttDrag;
  if(type==='move'){const len=ganttDrag.origEnd-ganttDrag.origStart;const ns=Math.max(1,Math.min(totalDays-len,ganttDrag.origStart+ddays));phase.start=ns;phase.end=ns+len;dragTip.textContent='Day '+phase.start+'–'+phase.end;}
  else if(type==='resize-left'){phase.start=Math.max(1,Math.min(ganttDrag.origEnd-1,ganttDrag.origStart+ddays));dragTip.textContent='Start: Day '+phase.start;}
  else if(type==='resize-right'){phase.end=Math.max(ganttDrag.origStart+1,Math.min(totalDays,ganttDrag.origEnd+ddays));dragTip.textContent='End: Day '+phase.end;}
  else if(type==='milestone'){ganttDrag.ms.day=Math.max(1,Math.min(totalDays,ganttDrag.origDay+ddays));dragTip.textContent='Day '+ganttDrag.ms.day;}
  dragTip.style.cssText=`display:block;left:${clientX+12}px;top:${clientY-30}px;`;
  renderGantt();
}
function handleDragEnd(){if(ganttDrag){save();ganttDrag=null;dragTip.style.display='none';}}

document.addEventListener('mousemove',e=>handleDragMove(e.clientX,e.clientY));
document.addEventListener('mouseup',handleDragEnd);
document.addEventListener('touchmove',e=>{if(ganttDrag){e.preventDefault();handleDragMove(e.touches[0].clientX,e.touches[0].clientY);}},{passive:false});
document.addEventListener('touchend',handleDragEnd);

document.getElementById('add-board-btn').onclick=()=>{document.getElementById('boardNameInput').value='';document.getElementById('boardModal').classList.add('open');document.getElementById('boardNameInput').focus();};
document.getElementById('boardModalCancel').onclick=()=>document.getElementById('boardModal').classList.remove('open');
document.getElementById('boardModalOk').onclick=()=>{const v=document.getElementById('boardNameInput').value.trim();if(!v)return;state.boards[v]={cols:[{id:'col'+(uid++),title:'To do',cards:[]},{id:'col'+(uid++),title:'Doing',cards:[]},{id:'col'+(uid++),title:'Done',cards:[]}],phases:[],totalDays:20,todayDay:1};state.active=v;document.getElementById('boardModal').classList.remove('open');save();render();};
document.getElementById('boardNameInput').onkeydown=e=>{if(e.key==='Enter')document.getElementById('boardModalOk').click();};
document.getElementById('pmCancel').onclick=()=>document.getElementById('phaseModal').classList.remove('open');
document.getElementById('pmOk').onclick=()=>{
  const name=document.getElementById('pmName').value.trim();const start=parseInt(document.getElementById('pmStart').value)||1;const end=parseInt(document.getElementById('pmEnd').value)||start+6;const color=document.getElementById('pmColor').value;
  const ms1=document.getElementById('pmMs1').value.trim();const ms2=document.getElementById('pmMs2').value.trim();if(!name)return;
  if(!board().phases)board().phases=[];const milestones=[];
  if(ms1){const p=ms1.split(',');milestones.push({id:'m'+(uid++),label:p[0].trim(),day:parseInt(p[1])||start+2,done:false});}
  if(ms2){const p=ms2.split(',');milestones.push({id:'m'+(uid++),label:p[0].trim(),day:parseInt(p[1])||end-1,done:false});}
  board().phases.push({id:'p'+(uid++),name,start,end,color,milestones});save();document.getElementById('phaseModal').classList.remove('open');if(currentView==='timeline')renderGantt();
};
document.getElementById('aiModalClose').onclick=()=>document.getElementById('aiModal').classList.remove('open');
[document.getElementById('boardModal'),document.getElementById('phaseModal'),document.getElementById('aiModal')].forEach(m=>{m.onclick=e=>{if(e.target===m)m.classList.remove('open');};});

load();
</script>
</body>
